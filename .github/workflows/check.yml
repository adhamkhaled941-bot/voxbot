name: Check VOX
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          VOX_URLS: "https://egy.voxcinemas.com/"
      - name: Save state
        run: |
          git config user.name "vox-bot"
          git config user.email "vox-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
